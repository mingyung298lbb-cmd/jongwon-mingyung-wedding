name: Optimize expanded gallery previews
on:
  push:
    paths:
      - '.github/workflows/build-gallery-rest-thumbnails.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image library
        run: python -m pip install --quiet Pillow
      - name: Generate WebP thumbnails for expanded gallery photos 13 through 33
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit
          from PIL import Image, ImageOps
          html=Path("index.html").read_text(encoding="utf-8")
          m=re.search(r"var albums=(\[\[.*?\]\]);",html,re.S)
          n=re.search(r"var displayOrder=\[([\d,]+)\];",html)
          if not (m and n):
              raise RuntimeError("Cannot find gallery source or ordering")
          albums=json.loads(m.group(1))
          sources=[src for group in albums for src in group]
          order=[int(i) for i in n.group(1).split(",")]
          if len(order)!=33 or len(set(order))!=33:
              raise RuntimeError("Unexpected gallery size")
          for pos in range(13,34):
              src=sources[order[pos-1]]
              name=urlsplit(src).path.lstrip("/")
              dest=f"gallery-preview-{pos:02}.webp"
              with Image.open(name) as image:
                  rgb=ImageOps.exif_transpose(image).convert("RGB")
                  rgb.thumbnail((480,720),Image.Resampling.LANCZOS)
                  rgb.save(dest,"WEBP",quality=80,method=6)
              size=Path(dest).stat().st_size
              print(f"#{pos}: {name} => {dest}, {size} bytes")
              if not 1000 <= size <= 200000:
                  raise RuntimeError(f"Invalid output {dest}: {size} bytes")
          PY
      - name: Commit new previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery-preview-{13..33}.webp
          git diff --cached --quiet || (git commit -m 'Generate lightweight gallery thumbnails for photos 13 to 33' && git push)
