name: Import user-provided Kakao OG thumbnail
on:
  push:
    paths:
      - .github/workflows/import-og-image-20261015.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save_uploaded_og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Save supplied Kakao thumbnail
        env:
          SOURCE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/3776014e-eee7-4dad-aa9b-6e7a4b75093f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDBiODBlY2MzZGRiOGFkYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjIxMjk0MH0.c4uhCqLMk0QouzhiKbjrbwAC2k76mqIezFuAIyj60_c'
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import io, os, urllib.request
          from PIL import Image
          with urllib.request.urlopen(os.environ["SOURCE_URL"], timeout=60) as response:
              source = response.read()
          photo = Image.open(io.BytesIO(source))
          assert photo.width == photo.height and photo.width >= 1000, "Unexpected supplied image"
          photo = photo.convert("RGB")
          photo.save("kakao-og-20261015.jpg", format="JPEG", quality=95, optimize=True, subsampling=0)
          print("Saved user-provided OG photo", photo.size)
          PY
      - name: Commit OG thumbnail to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-og-20261015.jpg
          git diff --cached --quiet || git commit -m 'Import user-supplied Kakao OG preview without changing invitation photos'
          git push
