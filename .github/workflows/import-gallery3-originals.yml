          git add gallery3new-photo-1.jpg gallery3new-photo-2.jpg gallery3new-photo-3.jpg gallery3new-photo-4.jpg gallery3new-photo-5.jpg gallery3new-photo-6.jpg gallery3new-photo-7.jpg gallery3new-photo-8.jpg
