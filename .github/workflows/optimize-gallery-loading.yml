name: Optimize gallery loading

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: contains(github.event.head_commit.message, '[optimize-gallery-loading]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Create lightweight high-quality JPEG
        run: python -c "from PIL import Image; im=Image.open('gallery2-photo-8-hq.png').convert('RGB'); im.save('gallery2-photo-8-hq.jpg','JPEG',quality=95,optimize=True,progressive=True); print(im.size)"

      - name: Update photo 8 reference
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='\"/gallery2-photo-8-hq.png?v=20261006-hq1\"'; new='\"/gallery2-photo-8-hq.jpg?v=20261006-fast1\"'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new),encoding='utf-8')"

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery2-photo-8-hq.jpg index.html
          git commit -m "Optimize gallery photo 8 loading"
          git push origin main
