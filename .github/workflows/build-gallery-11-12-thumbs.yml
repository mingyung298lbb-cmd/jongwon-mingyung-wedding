name: Build lightweight gallery previews 11 and 12
on:
  push:
    paths:
      - '.github/workflows/build-gallery-11-12-thumbs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image optimizer
        run: python -m pip install --quiet Pillow
      - name: Create thumbnails without modifying originals
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          photos = [
              ("20261011_181708_437.jpg", "gallery-preview-11.webp"),
              ("20261011_163036.png", "gallery-preview-12.webp"),
          ]
          for source, target in photos:
              with Image.open(source) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  im.thumbnail((480, 720), Image.Resampling.LANCZOS)
                  im.save(target, "WEBP", quality=79, method=6)
              size = Path(target).stat().st_size
              print(f"{target}: {size} bytes")
              if size > 180000 or size < 1000:
                  raise ValueError(f"unexpected size for {target}: {size}")
          PY
      - name: Commit optimized previews to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery-preview-11.webp gallery-preview-12.webp
          git diff --cached --quiet || (git commit -m 'Add compact thumbnails for gallery photos 11 and 12' && git push)
