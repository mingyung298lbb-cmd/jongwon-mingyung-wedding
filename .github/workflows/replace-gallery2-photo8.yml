name: Replace gallery 2 photo 8

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-photo:
    if: contains(github.event.head_commit.message, '[replace-gallery2-photo8]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download approved high-quality image
        env:
          IMAGE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/742e7c18-fe90-4086-a411-5f26e6660b9e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjkyOGIwODQ2ZDAzMGNhYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM1NzE4OH0.TJGOVasKZxdQJcPFxSXLQmhmPPIYlwAneXFRF3iVAiA"
        run: |
          curl --fail --location --retry 3 "$IMAGE_URL" --output gallery2-photo-8-hq.png
          test -s gallery2-photo-8-hq.png
          file gallery2-photo-8-hq.png

      - name: Point gallery 2 photo 8 to high-quality image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '"/gallery2-photo-8.webp?v=20261006-2"'
          new = '"/gallery2-photo-8-hq.png?v=20261006-hq1"'
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one old gallery slot, found {s.count(old)}")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery2-photo-8-hq.png index.html
          git commit -m "Replace gallery 2 photo 8 with high quality image"
          git push origin main
