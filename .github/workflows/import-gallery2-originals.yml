name: Import gallery 2 originals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-gallery2-originals.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.event.head_commit.message == 'Stage gallery 2 original imports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact original files
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-5778-8209-bfb8-61c738a1f7b5/raw?se=2026-10-05T00%3A35%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=44ecc804-3655-54e7-b18a-e150cc6f79f3&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T17%3A00%3A08Z&ske=2026-10-05T17%3A00%3A08Z&sks=b&skv=2026-02-06&sig=AKJ8d8UtfHREcHWs7FMbjALRw2KgYRzvRHC2xx6jPIU%3D' -o gallery2-photo-9.jpg
          curl -fL --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-865c-8209-85e9-8c7d5e0aa667/raw?se=2026-10-05T00%3A35%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=f04bf6a9-5ab9-5adb-be20-2afd66279b8e&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T21%3A06%3A11Z&ske=2026-10-05T21%3A06%3A11Z&sks=b&skv=2026-02-06&sig=MR3YPxeumLiC7mQLSuZ9Khd5DQrgZ9yI0i/waL1c15c%3D' -o gallery2-photo-10.jpg
          curl -fL --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-041c-8209-806b-af3931c1a2de/raw?se=2026-10-05T00%3A35%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=306966b4-1539-57b9-9cee-bed6ca86a65c&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T22%3A58%3A38Z&ske=2026-10-05T22%3A58%3A38Z&sks=b&skv=2026-02-06&sig=xDSMNnRx8LaCr%2Bn1kw1jNvliFU0Xz9BF2eLSFvHnLW4%3D' -o gallery2-photo-11.jpg
          cat > /tmp/checksums.txt <<'EOF'
          c932ee23f98581b539159d193ce53e45ec1c621f1e5fde28e5e1dc5bba59fa97  gallery2-photo-9.jpg
          7360a1e9a4e5556a16c100f8f1a680a289a9a809ff7e81b3cdd5f343090b02f7  gallery2-photo-10.jpg
          3204a6cbf90c3908f5367f993e2274bbbedda2ce7b549036260a0c6bd526adf0  gallery2-photo-11.jpg
          EOF
          sha256sum -c /tmp/checksums.txt
      - name: Commit original gallery 2 assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery2-photo-9.jpg gallery2-photo-10.jpg gallery2-photo-11.jpg
          git commit -m "Add three original photos to gallery 2"
          git push
