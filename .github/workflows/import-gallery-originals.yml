          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery1-photo-6.jpg gallery1-photo-7.jpg gallery1-photo-8.jpg gallery3-photo-1.jpg gallery3-photo-2.jpg gallery3-photo-3.jpg gallery3-photo-4.jpg gallery3-photo-5.jpg
          git commit -m "Add original gallery 1 and 3 photos"
