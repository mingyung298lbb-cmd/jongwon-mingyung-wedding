name: Import gallery originals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-gallery-originals.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.event.head_commit.message == 'Stage gallery original imports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact original files
