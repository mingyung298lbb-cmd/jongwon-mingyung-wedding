name: Replace gallery 1 cover original
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-gallery1-originals.yml'
permissions:
  contents: write
jobs:
  replace:
    if: github.event.head_commit.message == 'Stage gallery 1 cover replacement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact original JPEG
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-6a28-8209-9819-7594a98fba1d/raw?se=2026-10-05T00%3A06%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=ec7c3847-6381-54b4-919a-2593f0ec59b3&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T17%3A52%3A45Z&ske=2026-10-05T17%3A52%3A45Z&sks=b&skv=2026-02-06&sig=XJurrXCVVydHOGqSmWPhmLzaSUQuFbI5fqAzOT28hEo%3D' -o gallery1-photo-1.jpg
          echo 'a7c6d2dabfe1c3f2b84923dee68f4f37d0a17f7b7022063a954eb0768be13b7a  gallery1-photo-1.jpg' | sha256sum -c -
      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery1-photo-1.jpg
          git commit -m "Replace gallery 1 first photo with original"
          git push
