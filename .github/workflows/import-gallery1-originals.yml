name: Replace hero main original
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-gallery1-originals.yml'
permissions:
  contents: write
jobs:
  replace:
    if: github.event.head_commit.message == 'Stage hero main replacement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact original JPEG
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-974c-8206-bbfc-483e203b51da/raw?se=2026-10-05T00%3A17%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=591caca4-309e-5f4e-8a92-b5e6c6e68054&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T23%3A34%3A38Z&ske=2026-10-05T23%3A34%3A38Z&sks=b&skv=2026-02-06&sig=qL2LVyIj63FSwediAysayprRiG0fy9LhKAejLazPdtQ%3D' -o hero-main.jpg
          echo 'db035655ba6eb9ffe45161f27e15f59d16bfa590a5999f7013c5a7ee2d35439d  hero-main.jpg' | sha256sum -c -
      - name: Commit hero image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-main.jpg
          git commit -m "Replace hero main photo with original"
          git push
