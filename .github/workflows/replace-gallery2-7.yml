name: Replace gallery2 photo 7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-gallery2-7.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download exact selected photo
        run: |
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c8ab88d8-e6c5-4839-a946-5fad18ea83ae.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjNiNjdjM2NlNjZlZWJhZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM5NzgyMH0.XtMFEyRHEHfJabcUWhl4hV_bEpv9ONz0tPIqeOI6Ybg' -o gallery2-photo-7-hq.png
          test -s gallery2-photo-7-hq.png
      - name: Bust gallery cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old="/gallery2-photo-7-hq.png?v=20261006-hq1"
          new="/gallery2-photo-7-hq.png?v=20261006-final7"
          if old not in s:
              raise SystemExit("expected gallery2 photo 7 reference not found")
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/replace-gallery2-7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery2-photo-7-hq.png index.html .github/workflows/replace-gallery2-7.yml
          git commit -m "Replace gallery 2 photo 7 with selected image"
          git push origin main
