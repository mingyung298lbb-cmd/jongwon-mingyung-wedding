name: Preserve original photo shadow in Kakao OG
on:
  push:
    paths:
      - '.github/workflows/generate-kakao-og-landscape.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Fit full portrait into landscape OG without cropping the people
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src=Path("kakao-og-20261015-share-refresh-03.jpg")
          dst=Path("kakao-og-20261015-landscape-shadow-preserved.jpg")
          with Image.open(src) as im:
              im=ImageOps.exif_transpose(im).convert("RGB")
              assert im.size==(1536,1536), im.size
              # Keep the original photograph AND its existing soft pink drop
              # shadow. Crop only the outer blank square; never crop the shadow
              # or reconstruct the picture with a new shadow.
              portrait=im.crop((284,240,1247,1420))
              portrait.thumbnail((520,600),Image.Resampling.LANCZOS)
              canvas=Image.new("RGB",(1200,630),(255,255,255))
              canvas.paste(portrait,((1200-portrait.width)//2,(630-portrait.height)//2))
              canvas.save(dst,"JPEG",quality=92,subsampling=0,optimize=True)
          with Image.open(dst) as check:
              assert check.size==(1200,630), check.size
          assert dst.stat().st_size < 300000
          print("Created OG:",dst,check.size,dst.stat().st_size,"bytes")
          PY
      - name: Commit uncropped OG asset (no site deploy)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-og-20261015-landscape-shadow-preserved.jpg
          git diff --cached --quiet || (git commit -m 'Preserve original pink OG photograph shadow in landscape thumbnail' && git push)
