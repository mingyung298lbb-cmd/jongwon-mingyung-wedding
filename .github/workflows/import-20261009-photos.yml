name: Import wedding invitation photos
on:
  push:
    paths:
      - '.github/workflows/import-20261009-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original images as PNG
        env:
          PHOTO_5: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/215c5075-5f59-4fb4-8aed-ddf2ee692f9d.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjcxNzEyNDFmZGM0MDkxZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTY4OTE1M30.igrAHH2gnEk_50uEBq4I_2oDBphi1U7C1LPCbZ9GSko'
          PHOTO_17: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/3c2c8d5b-1d51-4e35-ba7d-b34ee06cd7bf.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2ZlY2QzYmFjY2RhMDE4NiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTY4MTIxMH0.7db4TSQGBD7vWGG9A8B1_wWIDs7LK1tg3Y4FGCWUm88'
          PHOTO_18: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d5f41d2c-00f5-4321-a47c-074ff85d14b8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmFhZjA3MDdjYWFiNDA1MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTY3MjE5OX0.XdMai1Hvp4Plk91QuvBYUgf8NFOadvbtKbWa2FavYEE'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$PHOTO_5" -o "mobile-photo-5-20261009.png"
          curl --fail --location --retry 3 --silent --show-error "$PHOTO_17" -o "mobile-photo-17-20261009.png"
          curl --fail --location --retry 3 --silent --show-error "$PHOTO_18" -o "mobile-photo-18-20261009.png"
          for f in mobile-photo-{5,17,18}-20261009.png; do
            test "$(file --brief --mime-type "$f")" = 'image/png'
            test "$(wc -c < "$f")" -gt 10000
          done
      - name: Save photos to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-photo-{5,17,18}-20261009.png
          git commit -m 'Add replacement photos 5, 17 and 18'
          git push
